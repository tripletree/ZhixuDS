<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="知序 FabricMind — 面向纺织产品开发的 DATA+BI+AI 智能决策系统。以数据智能驱动更精准的趋势判断、更高效的产品研发与更胜一筹的提案表达。"
    />
    <title>知序 FabricMind · 面向纺织产品开发的智能决策系统</title>
    <script>
      // Normalize legacy "#/route" hashes (e.g. "#/guidelines") to selector-safe
      // "#route" BEFORE any other script runs. A hash containing "/" is an invalid
      // CSS selector, so a global on-load handler that calls
      // document.querySelector(location.hash) throws a SyntaxError. Doing this here,
      // ahead of the module bundle and any injected runtime, prevents the throw even
      // when the page is opened directly at an old "#/..." URL.
      try {
        if (/^#\/+/.test(window.location.hash)) {
          var fmNormalized = '#' + window.location.hash.replace(/^#\/+/, '')
          window.history.replaceState(
            window.history.state,
            '',
            window.location.pathname +
              window.location.search +
              (fmNormalized === '#' ? '' : fmNormalized),
          )
        }
      } catch (e) {}
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        if (localStorage.getItem('fm-theme') === 'light') {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
