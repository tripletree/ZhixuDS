<!-- @dsCard group="Components" viewport="700x540" name="Filters · Light" subtitle="Checkbox · Radio · FilterChips · Collapse · Popover" -->
<!doctype html>
<html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{padding:20px 24px;background:#ffffff}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Collapse, Checkbox, CheckboxGroup, Radio, RadioGroup, FilterChips, Popover, Button } = window.FabricMindDesignSystem_4edb8c;
function Demo(){
  const [brands,setBrands]=React.useState(['aos','alyx']);
  const [tops,setTops]=React.useState(['tee','hoodie']);
  const [period,setPeriod]=React.useState('month');
  const [pop,setPop]=React.useState(true);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div style={{display:'flex',gap:32}}>
        <div style={{flex:'1 1 0'}}>
          <Collapse title="品牌" count={brands.length}>
            <CheckboxGroup value={brands} onChange={setBrands} options={[
              {value:'aos',label:'& Other Stories（官网）'},
              {value:'alyx',label:'1017 ALYX 9SM（官网）'},
              {value:'32works',label:'3/2 WORKS'},
              {value:'4th',label:'4th & Reckless'},
              {value:'5525',label:'5525gallery'},
            ]} />
            <button type="button" style={{marginTop:10,border:'none',background:'none',padding:0,fontSize:12,letterSpacing:'0.02em',color:'var(--color-azure)',cursor:'pointer'}}>查看所有</button>
          </Collapse>
          <Collapse title="面料" defaultOpen={false} style={{borderTop:'1px solid var(--border-hairline)'}}>
            <CheckboxGroup options={[{value:'lyocell',label:'Lyocell'},{value:'linen',label:'Linen Blend'}]} />
          </Collapse>
        </div>
        <div style={{flex:'1.2 1 0',display:'flex',flexDirection:'column',gap:18,paddingTop:10}}>
          <FilterChips multiple title="上装" value={tops} onChange={setTops} options={[
            {value:'tee',label:'T恤'},{value:'shirt',label:'衬衫'},{value:'knit',label:'毛衫'},
            {value:'hoodie',label:'卫衣'},{value:'jacket',label:'夹克'},{value:'polo',label:'Polo衫'},
          ]} />
          <div>
            <div style={{marginBottom:8,fontSize:12,letterSpacing:'0.02em',color:'var(--color-bone-dim)'}}>更新时间</div>
            <RadioGroup direction="row" gap={16} value={period} onChange={setPeriod} options={[
              {value:'week',label:'前一周'},{value:'month',label:'前一月'},{value:'year',label:'前一年'},
            ]} />
          </div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <Checkbox checked>已选 2 项</Checkbox>
            <Checkbox indeterminate>部分选中</Checkbox>
          </div>
        </div>
      </div>
      <Popover open={pop} onOpenChange={setPop} width={300}
        anchor={<Button variant="nav" size="sm">更多筛选</Button>}>
        <div style={{display:'flex',flexDirection:'column',gap:12,textAlign:'left'}}>
          <span style={{fontSize:13,fontWeight:500,color:'var(--color-bone)'}}>编辑时间范围</span>
          <RadioGroup value={period} onChange={setPeriod} options={[
            {value:'week',label:'前一周'},{value:'month',label:'前一月'},{value:'year',label:'前一年'},
          ]} />
          <span style={{fontSize:11,letterSpacing:'0.02em',color:'var(--color-mist)'}}>实际时间范围 · 2026-06-01 ≤ date &lt; 2026-07-01</span>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
            <Button variant="ghost" size="sm" onClick={()=>setPop(false)}>取消</Button>
            <Button size="sm" onClick={()=>setPop(false)}>应用</Button>
          </div>
        </div>
      </Popover>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
