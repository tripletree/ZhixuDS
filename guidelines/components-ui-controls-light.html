<!doctype html>
<html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{padding:20px 24px;background:#ffffff}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Panel, Field, Input, Listbox, Select, TextArea } = window.FabricMindDesignSystem_4edb8c;
const microLabel = {fontSize:10,letterSpacing:'0.22em',textTransform:'uppercase',fontWeight:500,color:'var(--color-bone-dim)'};
function Demo(){
  const [scene,setScene]=React.useState('trend');
  return (
    <div style={{display:'flex',gap:20,alignItems:'stretch'}}>
      <Panel variant="glass" padding={24} style={{flex:'1.3 1 0',display:'flex',flexDirection:'column',gap:14}}>
        <Field label="关键词"><Input icon="search" placeholder="搜索材料、趋势或品类" /></Field>
        <div style={{display:'flex',gap:12}}>
          <Field label="需求场景" hint="Listbox · 自定义下拉面板" style={{flex:1}}>
            <Listbox value={scene} onChange={setScene} options={[
              {value:'trend',label:'趋势研究',hint:'Trend'},
              {value:'material',label:'材料创新',hint:'Material'},
              {value:'proposal',label:'客户提案',hint:'Proposal'},
            ]} />
          </Field>
          <Field label="交付格式" hint="Select · 原生下拉" style={{flex:1}}>
            <Select defaultValue="ppt">
              <option value="ppt">PPT 提案</option>
              <option value="report">数据报告</option>
              <option value="board">灵感看板</option>
            </Select>
          </Field>
        </div>
        <Field label="补充说明" hint="选填 · 帮助我们提前了解你的需求"><TextArea rows={2} placeholder="其他想让我们了解的信息" /></Field>
      </Panel>
      <div style={{flex:'1 1 0',display:'flex',flexDirection:'column',gap:14}}>
        <Panel glow="sm" padding={20} style={{flex:1}}>
          <span style={microLabel}>Panel · 内容卡</span>
          <p style={{margin:'8px 0 0',fontSize:13,lineHeight:1.625,color:'var(--color-bone-soft)'}}>对角高光渐变 + 1px 面板描边，用于承载正文内容，右上角可加 azure 辉光。</p>
        </Panel>
        <Panel variant="feature" padding={20} style={{flex:1}}>
          <span style={microLabel}>Feature · 1.5rem</span>
          <p style={{margin:'8px 0 0',fontSize:13,lineHeight:1.625,color:'var(--color-bone-soft)'}}>特性卡使用更大的 1.5rem 圆角，其余与内容卡一致。</p>
        </Panel>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
