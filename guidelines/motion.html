<!-- @dsCard group="Motion" viewport="700x170" name="Motion language" subtitle="--ease-calm cubic-bezier(0.22,1,0.36,1) · shimmer · caret · ping" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;display:flex;gap:12px;font-family:var(--font-sans)}.cell{flex:1;height:120px;border-radius:12px;border:1px solid var(--border-hairline);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.cell span{font-size:10px;color:var(--color-mist);letter-spacing:0.04em}
@keyframes rise{0%,20%{opacity:0;transform:translateY(18px)}60%,80%{opacity:1;transform:none}100%{opacity:0}}
.riser{animation:rise 3s var(--ease-calm) infinite}</style>
</head><body>
<div class="cell"><div class="riser" style="width:64px;height:34px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14)"></div><span>reveal · rise 22–30px / 0.75s</span></div>
<div class="cell"><div class="animate-shimmer" style="position:absolute;inset:0 0 auto;height:33%;background:linear-gradient(to bottom,transparent,rgba(87,184,212,0.07),transparent)"></div><span>shimmer · 生成中</span></div>
<div class="cell"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:13px;color:var(--color-bone-dim);letter-spacing:0">向知序提问</span><span class="animate-caret" style="display:inline-block;height:14px;width:1px;background:var(--color-azure)"></span></div><span>caret · 输入光标</span></div>
<div class="cell"><div style="position:relative;display:flex;width:8px;height:8px"><span class="animate-ping" style="position:absolute;inset:0;border-radius:999px;background:rgba(87,184,212,0.6)"></span><span style="position:relative;width:8px;height:8px;border-radius:999px;background:var(--color-azure)"></span></div><span>ping · 引擎分析中</span></div>
</body></html>
