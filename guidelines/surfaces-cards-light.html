<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;display:flex;gap:14px;font-family:var(--font-sans)}</style>
</head><body>
<div class="panel glow-blue glow-blue-sm" style="flex:1.3;border-radius:1rem;padding:20px">
<span style="position:absolute;right:16px;top:14px;font-family:var(--font-display);font-style:italic;font-size:14px;color:color-mix(in srgb,var(--color-bone-dim) 50%,transparent)">01</span>
<div style="font-size:15px;font-weight:600;color:var(--color-bone)">行业数据底座</div>
<div style="font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--color-bone-dim);margin-top:2px">Data Foundation</div>
<p style="font-size:13px;line-height:1.6;color:var(--color-bone-dim);margin:10px 0 0">.panel — 对角高光渐变 + 1px 白色 14% 描边，无模糊。用于内容卡片。</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center">
<div class="glass" style="border-radius:12px;padding:12px 16px">
<div class="eyebrow" style="color:var(--color-bone-dim)">机会指数</div>
<div style="font-size:18px;font-weight:600;color:var(--color-bone)">78<span style="font-size:13px;color:var(--color-bone-dim)">/100</span></div>
</div>
<div class="glass" style="border-radius:8px;padding:8px 14px;font-size:13px;color:var(--color-bone-soft)">.glass — 12px 磨砂浮层</div>
</div>
</body></html>
