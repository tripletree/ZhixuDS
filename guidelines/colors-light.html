<!-- @dsCard group="Colors" viewport="700x190" name="Light theme" subtitle="html.light inverts ink→white, bone→dark; azure deepens" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;display:flex;gap:12px}.half{flex:1;border-radius:12px;padding:16px;font-family:var(--font-sans)}.half h4{margin:0 0 4px;font-size:14px;font-weight:600}.half p{margin:0;font-size:12px}.chip{display:inline-flex;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:11px;letter-spacing:0.02em}</style>
</head><body>
<div class="half" style="background:#0a0c10;border:1px solid rgba(236,234,225,0.08)">
<h4 style="color:#eceae1">深色 · Dark（默认）</h4>
<p style="color:#9a9a95">曜石黑底，冷米白文字</p>
<span class="chip" style="background:#eceae1;color:#07080a">预约演示</span>
<span class="chip" style="border:1px solid rgba(87,184,212,0.4);color:#6fd0ec;background:rgba(87,184,212,0.1)">azure #57b8d4</span>
</div>
<div class="half theme-light" style="background:#ffffff;border:1px solid rgba(0,0,0,0.06);box-shadow:0 18px 44px -26px rgba(0,0,0,0.16)">
<h4 style="color:#14171c">浅色 · Light</h4>
<p style="color:#5d6470">纯白底，墨色文字</p>
<span class="chip" style="background:#14171c;color:#ffffff">预约演示</span>
<span class="chip" style="border:1px solid rgba(44,126,152,0.4);color:#2c7e98;background:rgba(44,126,152,0.08)">azure #2c7e98</span>
</div>
</body></html>
