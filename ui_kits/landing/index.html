<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知序 FabricMind · 面向纺织产品开发的智能决策系统</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
@keyframes fm-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--fm-dist,-12px))}}
.fm-lift{transition:transform 0.3s var(--ease-calm),border-color 0.3s var(--ease-calm)}
.fm-lift:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--color-azure) 25%,transparent)!important}
.fm-zoom{transition:transform 0.7s var(--ease-calm)}
.fm-lift:hover .fm-zoom{transform:scale(1.05)}
.fm-nav-link:hover{color:var(--color-bone)!important}
@keyframes fm-dialog-in{from{opacity:0;transform:scale(0.95) translateY(16px)}to{opacity:1;transform:none}}
.fm-dialog-in{animation:fm-dialog-in 0.3s var(--ease-calm)}
.fm-slide{border:1px solid color-mix(in srgb,var(--color-bone) 10%,transparent);background:color-mix(in srgb,var(--color-ink-800) 90%,transparent);box-shadow:0 20px 25px -5px rgba(0,0,0,0.4);backdrop-filter:blur(8px)}
html.light .fm-slide{border-color:rgba(0,0,0,0.08);background:#fff;box-shadow:0 14px 30px -14px rgba(0,0,0,0.25)}
html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color 0.4s var(--ease-calm),background 0.4s var(--ease-calm),color 0.4s var(--ease-calm),border-color 0.4s var(--ease-calm),box-shadow 0.4s var(--ease-calm)!important}
.tryon-fig-0{stop-color:#2c313b}.tryon-fig-1{stop-color:#0e1117}
.tryon-top-0{stop-color:#eceae1;stop-opacity:0.85}.tryon-top-1{stop-color:#c8c7c0;stop-opacity:0.5}
html.light .tryon-fig-0{stop-color:#a2aab6}html.light .tryon-fig-1{stop-color:#6d7684}
html.light .tryon-top-0{stop-color:#ffffff;stop-opacity:0.95}html.light .tryon-top-1{stop-color:#e2ded2;stop-opacity:0.85}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="mocks.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
</script>
</body></html>
