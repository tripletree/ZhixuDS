<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px;background:#0a0c10}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DateRangeEditor, DropdownMenu, IconButton, AlphabetIndex, EmptyState, Field, Button, Checkbox } = window.FabricMindDesignSystem_4edb8c;
const RANGES = { week:'2026-07-15 ≤ date < 2026-07-22', month:'2026-06-01 ≤ date < 2026-07-01', year:'2025-07-01 ≤ date < 2026-07-01' };
function Demo(){
  const [period,setPeriod]=React.useState('month');
  const [letter,setLetter]=React.useState('A');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:24,alignItems:'flex-start'}}>
        <Field label="时间" required style={{flex:'0 0 240px'}}>
          <DateRangeEditor value={period} onChange={setPeriod}
            presets={[{value:'week',label:'前一周'},{value:'month',label:'前一月'},{value:'year',label:'前一年'}]}
            rangeText={d=>`实际时间范围 · ${RANGES[d]}`} />
        </Field>
        <span style={{flex:1}}></span>
        <div style={{display:'flex',alignItems:'center',gap:8,paddingTop:26}}>
          <span style={{fontSize:12,color:'var(--color-bone-dim)'}}>品类分布</span>
          <DropdownMenu onSelect={()=>{}} anchor={<IconButton name="ellipsis-vertical" label="更多操作" />} items={[
            {key:'export',label:'导出 PPT',icon:'download'},
            {key:'report',label:'生成报告',icon:'file-image'},
            {type:'divider'},
            {key:'remove',label:'移除看板',icon:'x',danger:true},
          ]} />
        </div>
      </div>
      <div>
        <div style={{marginBottom:8,fontSize:12,letterSpacing:'0.02em',color:'var(--color-bone-dim)'}}>品牌索引</div>
        <AlphabetIndex value={letter} onChange={setLetter} available={['#','A','B','C','D','L','M','R','S','U']} />
        <div style={{marginTop:10,display:'flex',gap:16}}>
          <Checkbox checked>Acne Studio（官网）</Checkbox>
          <Checkbox>Adidas</Checkbox>
          <Checkbox>Alexander McQueen</Checkbox>
        </div>
      </div>
      <div style={{borderRadius:'var(--radius-card)',border:'1px solid var(--border-hairline)'}}>
        <EmptyState title="暂无数据" description="连接数据源后，这里将展示筛选范围内的商品数量与品类分布。"
          action={<Button variant="ghost" size="sm">管理数据库</Button>} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
